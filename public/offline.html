<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087f68" />
    <title>Sin conexión · K66 Rondas</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f8f7; color: #18252a; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; background: #fff; border: 1px solid #dce5e2; border-radius: 28px; box-shadow: 0 12px 35px rgba(8, 64, 52, .08); }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 24px 0 8px; font-size: 30px; line-height: 1.2; }
      p { color: #5d6d72; }
      .notice { margin: 20px 0; padding: 16px; border-radius: 14px; background: #e8f4ef; color: #08654f; font-weight: 600; }
      a { display: block; margin-top: 24px; padding: 14px; border-radius: 14px; background: #087f68; color: #fff; text-align: center; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #18252a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>K66 Rondas necesita internet para confirmar cada visita.</p>
      <div class="notice">No se guardó ningún QR sin confirmación. Cuando vuelva la conexión, escanéalo de nuevo.</div>
      <a href="/app">Reintentar</a>
    </main>
  </body>
</html>
