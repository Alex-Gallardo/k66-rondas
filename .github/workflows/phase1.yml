name: K66 · calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web y diseño
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Esquema y permisos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x realtime,imgproxy,logflare,vector,edge-runtime,studio,postgres-meta,supavisor,mailpit
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase seed buckets --yes
      - run: pnpm exec supabase db query --file supabase/tests/phase1.sql
      - run: pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase-status.env"
      - run: node scripts/prepare-ci-env.mjs "$RUNNER_TEMP/supabase-status.env"
      - run: node scripts/seed-ci-users.mjs
      - run: pnpm exec supabase db query --file supabase/tests/phase2.sql
      - run: pnpm exec supabase db query --file supabase/tests/phase3_t11.sql
      - run: pnpm exec supabase db query --file supabase/tests/phase3_t12.sql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_PHASE2: "1"
