name: K66 · smoke de producción

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar rutas públicas, base y acceso anónimo
        run: node scripts/smoke-production.mjs https://k66-rondas.vercel.app
      - name: Indicar procedimiento si falla
        if: failure()
        run: echo "::error::Revisar docs/T23_OPERACION.md y los logs de Vercel/Supabase."
